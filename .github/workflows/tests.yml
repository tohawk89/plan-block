name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.db }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        db: [sqlite]
        include:
          # Testbench version per Laravel version
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

          # MySQL and PostgreSQL on the oldest and newest supported Laravel
          - { php: '8.3', laravel: '12.*', testbench: '10.*', stability: prefer-stable, db: mysql }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', stability: prefer-stable, db: pgsql }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable, db: mysql }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable, db: pgsql }

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: plan_block
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plan_block
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|pestphp/pest|phpunit/phpunit) '

      - name: Configure database
        run: |
          case "${{ matrix.db }}" in
            mysql) echo "DB_CONNECTION=mysql" >> "$GITHUB_ENV"; echo "DB_PORT=3306" >> "$GITHUB_ENV"; echo "DB_USERNAME=root" >> "$GITHUB_ENV"; echo "DB_PASSWORD=" >> "$GITHUB_ENV" ;;
            pgsql) echo "DB_CONNECTION=pgsql" >> "$GITHUB_ENV"; echo "DB_PORT=5432" >> "$GITHUB_ENV"; echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"; echo "DB_PASSWORD=postgres" >> "$GITHUB_ENV" ;;
          esac
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_DATABASE=plan_block" >> "$GITHUB_ENV"

      - name: Run tests
        run: vendor/bin/pest --colors=always
